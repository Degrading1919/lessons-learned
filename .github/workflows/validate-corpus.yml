name: Validate evidence corpus

on:
  push:
    paths:
      - "datasets/**"
      - "scripts/validate_cases.py"
      - "scripts/validate_harness_baselines.py"
      - ".github/workflows/validate-corpus.yml"
  pull_request:
    paths:
      - "datasets/**"
      - "scripts/validate_cases.py"
      - ".github/workflows/validate-corpus.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_cases.py
      - run: python scripts/validate_model_baselines.py
      - run: python scripts/validate_harness_baselines.py
